name: Walmart Payment Statements Sync

on:
  # Every Thursday at 10:00 AM Mexico City time (UTC-6 = 16:00 UTC)
  # Walmart cuts weekly on Wednesdays; statements available Thursday morning
  schedule:
    - cron: '0 16 * * 4'

  # Manual trigger — useful to recover missed weeks or after UI changes
  workflow_dispatch:

jobs:
  sync:
    name: Download & import payment statements
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: automation/package.json

      - name: Install automation dependencies
        working-directory: automation
        run: npm install

      - name: Install Playwright Chromium
        working-directory: automation
        run: npx playwright install chromium --with-deps

      - name: Run sync
        working-directory: automation
        env:
          WALMART_SELLER_EMAIL:    ${{ secrets.WALMART_SELLER_EMAIL }}
          WALMART_SELLER_PASSWORD: ${{ secrets.WALMART_SELLER_PASSWORD }}
          IMPORT_API_URL:          ${{ secrets.IMPORT_API_URL }}
          IMPORT_CRON_SECRET:      ${{ secrets.IMPORT_CRON_SECRET }}
        run: node walmart-sync.mjs

      - name: Upload debug screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: automation/debug-*.png
          retention-days: 7
